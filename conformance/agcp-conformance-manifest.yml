agcp_conformance_manifest:
  spec:
    name: AGCP
    release_model: repository_release
    version_source: VERSION
    repository_release_target: v2.0.8
    repository_release_target_status: public-review-controlled-baseline
    artifact_lifecycle_state: current
    controlling_published_baseline: v2.0.8
    controlling_baseline_status: public-review-controlled-baseline
    baseline_date: 2026-08-14
    agcp_release: v2.0.8
    rtm_dataset_version: RTM-1.46
    schema_catalog_version: 1.0.50
    interface_catalog_version: 1.0.5
    registry_entry_catalog_version: 1.0.3
    implementation_profile_catalog_version: 1.0.3
  normative_statement_inventory:
    unique_identifier_count: 357
    core_source_text_occurrence_count: 358
    canonical_duplicate_identifier: NS-2.7-01
    intentionally_unassigned_identifier: NS-17.2-01
    disposition: CANONICALIZED_DUPLICATE
    validation_script: governance/validate_normative_statement_inventory.py
    validation_report: governance/AGCP-normative-statement-inventory-validation.json
  release_lifecycle_metadata:
    finding: P2-01
    policy: governance/AGCP-Release-Lifecycle-Metadata-Policy.md
    machine_readable_policy: governance/release-lifecycle-metadata.json
    validation_script: governance/validate_release_lifecycle_metadata.py
    validation_report: governance/AGCP-release-lifecycle-metadata-validation.json
  normative_precedence:
    order:
    - Published AGCP Runtime Governance Conformance Requirements (CRs)
    - AGCP Core Specification
    - Applicable normative Companion Specifications expressly adopted by the implementation
      profile
    - Implementation Profiles
    - AGCP Conformance Test Suite
    - Reference Implementations
    architectural_interpretation: 'The Architecture Reference Model governs architectural
      terminology and concept meaning where an ARM-defined concept is used, but does
      not independently create conformance obligations.

      '
  normative_traceability:
    model:
    - Published CRs and applicable Core behavior
    - Applicable adopted normative Companion Specification obligations
    - Core-derived Normative Statement (NS) identifiers
    - Requirements Traceability Matrix (RTM) mappings
    - Conformance Test Case (TC)
    description: 'The RTM is the authoritative conformance traceability artifact.
      Normative Statements identify atomic obligations extracted from the Core and
      do not supersede the CRs, Core, or applicable adopted normative Companion Specifications.
      Harness checks and test vectors provide executable realization of Test Cases
      and SHALL NOT introduce independent normative requirements.

      '
  normative_documents:
  - spec/AGCP_Runtime_Governance_Requirements_CR-001_thru_CR-122.csv
  - spec/AGCP-Core.docx
  - spec/AGCP-Policy-Evaluation-Contract.md
  - spec/AGCP-HTTP-Interface-Specification.md
  - spec/AGCP-Provenance-Wire-Format-Specification.md
  - spec/AGCP-Human-Review-Specification.md
  - spec/AGCP-Multitenant-Operational-Specification.md
  - spec/ledger/AGCP-Append-Only-Governance-Ledger-Specification.md
  - spec/AGCP-Error-Mapping.md
  api_contract:
    file: api/AGCP-HTTP-Contract.yaml
    description: OpenAPI contract for AGCP HTTP interface conformance.
    interface_id: IF-001
    interface_version: v2
  schemas:
    directory: schemas/
    description: Published JSON Schemas for AGCP governance artifacts, requests, responses,
      and common types.
  registries:
    directory: registries/
    description: Published registries for rejection codes, constraint types, invariant
      types, and related registered values.
  implementation_profiles:
    directory: implementer/
    format_specification: implementer/AGCP-Implementation-Profile-Specification.md
    schema: implementer/AGCP-Implementation-Profile-Schema.json
    catalog: implementer/implementation-profile-catalog.json
    package_manifest: implementer/implementation-profile-manifest.json
    validation_script: governance/validate_implementation_profiles.py
    validation_report: governance/AGCP-implementation-profile-validation.json
    profiles: []
    description: 'Controlled profile-format artifacts and public Implementation Profiles.
      Profile-format validation establishes serialization validity only and does not
      establish AGCP conformance.

      '
  conformance_artifacts:
    relationship_model:
      file: conformance/AGCP-Conformance-Traceability-and-Automation-Model.md
      description: Defines the normative relationship semantics among CRs, NS identifiers,
        the RTM, Formal Test Cases, Harness Checks, Harness Test Vectors, execution
        evidence, assessment results, and conformance claims without creating new
        implementation obligations.
    conformance_specification:
      file: conformance/AGCP-Conformance.md
      description: Defines conformance profiles, required conformance behavior, and
        repository-release conformance model.
    test_suite:
      file: conformance/Conformance Test Suite.md
      description: Defines the authoritative Formal Test Case methodology, required
        evidence, and assessment-result rules.
    test_matrix:
      file: conformance/AGCP-Test-Matrix.md
      description: Human-readable mapping between validated capabilities and representative
        harness test vectors.
    test_mapping:
      file: conformance/test-mapping.json
      description: Machine-readable CR/Core-derived-NS/TC mapping extended to DS,
        IF, REG, fixtures, Harness Checks, and Harness Test Vectors, with explicit
        dispositions where no dedicated vector exists.
    harness_checks:
      file: conformance/harness-checks.json
      description: Executable harness checks. These are harness-local checks and are
        not an independent normative assertion layer.
    deterministic_test_vectors:
      file: conformance/AGCP-Conformance-Test-Vectors.md
      description: Fifty-four deterministic execution scenarios covering all ten mandatory
        IF-001 operations, Proposal Qualification, Governance Decision, Governance
        Approval and Adjudication, Execution Authorization, applicable pre-commit
        Continuation Integrity, Governance Realization, Commit-Bound Admissibility,
        Policy Enforcement Point and Commit Boundary behavior, governance-artifact
        registration and retrieval, Governance Configuration, deterministic Governance
        Compilation, constitutional validation, omission analysis, Governance Self-Protection,
        atomic Controlled Governance Activation, governed rollback, cross-cutting
        Governance Evidence, Append-Only Governance Ledger behavior, Canonical State
        resolution, idempotency, and isolation behavior.
    harness_specification:
      file: conformance/AGCP-Conformance-Harness-Spec.yml
      description: Specification for running automated AGCP conformance tests.
    harness_request_parameter_validation:
      file: conformance/AGCP-harness-request-parameter-validation.json
      description: Controlled validation record proving that every primary request
        and HTTP setup prestep supplies every required IF-001 path, query, and header
        parameter.
    harness_error_model_validation:
      file: conformance/AGCP-harness-error-model-validation.json
      description: Controlled validation record proving that every declared harness
        rejection-code and HTTP-status pair agrees with the normative Error Mapping
        and active rejection-code registry, that every expected primary or setup status
        is declared by the matched IF-001 OpenAPI operation, and that governance-significant
        Error Mapping obligations preserve the Core Governance Evidence requirement.
    if001_executable_operation_coverage_validation:
      file: conformance/AGCP-if001-executable-operation-coverage-validation.json
      description: Controlled validation record proving that all ten mandatory IF-001
        operations have schema-valid positive executable coverage and that the five
        operations added under F-08 have all applicable negative, tenant/domain-isolation,
        and idempotency scenarios.
    governance_compilation_activation_executable_validation:
      file: conformance/AGCP-governance-compilation-activation-executable-validation.json
      description: Controlled validation record proving that every MUST Harness Check
        has at least one substantive executable vector and that Governance Configuration,
        deterministic compilation, constitutional validation, omission analysis, self-protection,
        atomic controlled activation, failure preservation, governed rollback, evidence,
        and lineage are asserted.
    reference_integrity:
      disposition_document: governance/AGCP-Normative-Companion-Reference-Dispositions.md
      machine_readable_dispositions: governance/normative-companion-reference-dispositions.json
      validation_script: governance/validate_normative_companion_references.py
      validation_report: governance/AGCP-normative-companion-reference-validation.json
      finding: P1-01
      description: Controlled disposition and repository-wide validation of absent
        or noncanonical normative companion references.
    fixture_mapping:
      file: conformance/fixture-mapping.json
      description: Machine-readable mapping from exact active schema files to validated
        conformance examples.
    schema_examples:
      directory: schemas/examples/
      description: Draft 2020-12-valid canonical examples used by the conformance
        fixture catalog.
  pass_criteria:
    requirements:
    - All applicable Normative Statement, Conformance Requirement, and Test Case mappings
      must pass.
    - Every fixture in conformance/fixture-mapping.json must validate against its
      exact active schema file before harness execution.
    - All applicable deterministic test vectors must pass.
    - Every mandatory IF-001 operation must have at least one schema-valid positive
      executable vector, and operations added under F-08 must have the applicable
      negative, tenant/Governance-Domain-isolation, and idempotency coverage defined
      by the controlled operation-coverage record.
    - Governance-significant events must be recorded in the Append-Only Governance
      Ledger where required.
    - Canonical State SHALL be deterministically resolved from qualified authoritative
      governance sources. The ordered Governance Ledger is authoritative for recorded
      governance events, authoritative event ordering, and Derived Lifecycle State.
    - Materialized governance state used for replay must be verifiably derived from
      the applicable authoritative sources and ledger records.
    - Governance Evidence must be produced as a cross-cutting supporting service during
      every applicable governance-significant stage, linked, attributable, integrity-protected,
      and sufficient for audit and deterministic replay.
    - Governance Approval and Adjudication, Execution Authorization, applicable pre-commit
      Continuation Integrity, Governance Realization, final Commit-Bound Admissibility,
      Policy Enforcement Point, and Commit Boundary requirements must be enforced
      where applicable.
    - Tenant and Governance Domain isolation requirements must be enforced where applicable.
    - Every MUST Harness Check must reference at least one substantive executable
      vector, and every declared expected behavior must be asserted by the controlled
      vector catalog.
  determinism_requirements:
  - Governance pipeline execution order must include Proposal Qualification, Governance
    Decision Function, Execution Authorization or another eligible nonterminal state,
    applicable pre-commit Continuation Integrity, and Governance Realization/Commit
    Boundary processing.
  - Governance Evidence must be treated as a cross-cutting supporting service rather
    than a terminal pipeline stage.
  - Identical authoritative inputs must produce equivalent externally observable governance
    outcomes.
  - Replay of identical proposals using the applicable replay-protection or idempotency
    mechanism must not create conflicting governance state.
  - Ledger sequence order, not timestamp order, SHALL determine the authoritative
    ordering of recorded governance events and the derivation of Derived Lifecycle
    State.
  - Where Canonical State incorporates Governance Ledger records, those records SHALL
    be interpreted according to authoritative ledger ordering. Other Canonical State
    facts SHALL be resolved from their applicable qualified authoritative governance
    sources.
  - Materialized Canonical State views must be reproducible from the applicable qualified
    authoritative governance sources, including ordered Governance Ledger records
    for recorded governance events and Derived Lifecycle State.
  conformance_profiles:
    L1:
      name: Schema & Envelope Validation
      description: Baseline interface, schema, structured error, and metadata conformance.
    L2:
      name: Ordered Governance Mediation
      description: Proposal Qualification, Governance Decision, Governance Evidence,
        and ledger recording behavior.
    L3:
      name: Deterministic Governance
      description: Deterministic replay, Canonical State source resolution, and authoritative
        ledger-ordering behavior.
    L4:
      name: Execution Authorization Control
      description: Governance Approval enforcement, governed-adjudication validation,
        Execution Authorization validation, and Commit Boundary gating.
    L5:
      name: Multitenant Governance Isolation
      description: Tenant isolation, Governance Domain isolation, and cross-boundary
        negative-test behavior.
  implementation_modes:
    reference_implementation:
      normative: false
      description: Demonstrates architectural conformance and executable semantics
        but may omit production hardening.
    production_implementation:
      normative: false
      description: Operational implementation intended to satisfy applicable normative,
        security, operational, and conformance requirements.
  notes:
  - This manifest is an index and execution aid for the conformance package.
  - Repository releases govern versioning.
  - Harness checks and test vectors SHALL remain synchronized with the Requirements
    Traceability Matrix and conformance test cases.
  - Conflicts SHALL be resolved using the normative_precedence order above. The RTM
    mappings and Core-derived NS identifiers govern traceability but do not alter
    normative precedence; all take precedence over harness-local artifacts only to
    the extent established by that order.
