# AGCP Conformance Harness Specification
# Deterministic test vectors aligned with the current AGCP repository architecture.
# Repository release versioning is authoritative; this file intentionally omits an embedded specification version.

meta:
  suite_id: agcp_conformance_harness
  status: normative-harness-specification
  versioning: repository_release
  description: Deterministic AGCP conformance harness vectors aligned with Proposal, Governance Evidence, Append-Only Governance Ledger, Human Review, Execution Authorization, Commit Boundary, and ledger-derived Canonical State semantics.
  assumptions:
    append_only_governance_ledger_required: true
    canonical_state_derived_from_ordered_ledger: true
    materialized_canonical_state_must_be_reproducible_from_ordered_ledger: true
    ledger_sequence_order_is_authoritative: true
    timestamp_order_is_not_authoritative_for_state_derivation: true
    submitted_state_is_not_externally_observable: true
    governance_evidence_required_for_governance_significant_processing: true
globals:
  base_url: https://api.example.com
  tenants:
    T1: T1
    T2: T2
  governance_domains:
    D1: domain-primary
    D2: domain-secondary
  auth:
    T1:
      scheme: bearer
      token: TEST_TOKEN_FOR_T1
    T2:
      scheme: bearer
      token: TEST_TOKEN_FOR_T2
  policy_ref:
    valid: &id001
      policy_id: P1
      policy_release: repo-release-test
      policy_hash: abcdef0123456789
    missing: &id008
      policy_id: P_MISSING
      policy_release: missing-release
  canonical_state_ref:
    valid: &id003
      canonical_state_id: CS1
      canonical_state_hash: 0123456789abcdef
      resolved_at: '2026-02-25T12:00:00Z'
  governance_context_ref:
    valid: &id002
      governance_context_id: GCX1
      governance_context_hash: abcdefabcdef1234
  authority_lineage_ref:
    valid: &id004
      authority_lineage_id: AL1
      authority_lineage_hash: 1234567890abcdef
  governance_configuration_ref:
    valid: &id005
      governance_configuration_id: CFG1
      governance_configuration_hash: fedcba0987654321
  provenance:
    valid: &id006
      signer: client:test
      signature:
        alg: Ed25519
        kid: kid-test
        sig: SIG_VALID
      signed_at: '2026-02-25T12:00:00Z'
    invalid: &id007
      signer: client:test
      signature:
        alg: Ed25519
        kid: kid-test
        sig: SIG_INVALID
      signed_at: '2026-02-25T12:00:00Z'
hooks:
  tenant_state:
    T1: ACTIVE
    T2: ACTIVE
  policy_resolution:
    P1: found
    P_MISSING: not_found
  pec:
    constraints_outcome: PASS
    constraints_rejection_code: CONSTRAINT_FAIL
    invariants_hard_fail: false
    invariants_rejection_code: INVARIANT_HARD_FAIL
    human_review_required: false
    required_review_roles:
    - RISK_OFFICER
    - SECURITY_LEAD
  ledger:
    append_only: true
    assign_sequence_value: true
    include_ledger_entry_id: true
    include_previous_ledger_entry_hash: true
assertions:
- id: HARNESS-NO-SUBMITTED-STATE
  description: Externally observable Proposal views SHALL NOT expose SUBMITTED or other transient pre-decision states.
  apply_to_responses:
    must_not_include_state:
    - SUBMITTED
    - SUBMITTED_TRANSIENT
- id: HARNESS-PIPELINE-ORDER
  description: When ledger_append is expected, governance pipeline event ordering SHALL match expected sequence order.
  apply_to_ledger:
    enforce_exact_order_on_expected_append: true
    ordering_key: ledger_sequence_value
- id: HARNESS-LEDGER-IMMUTABILITY
  description: Ledger entries SHALL be append-only and immutable.
  apply_to_ledger:
    forbid_update: true
    forbid_delete: true
    forbid_reorder: true
- id: HARNESS-CANONICAL-STATE-DERIVATION
  description: Canonical State SHALL be reproducible from ordered Append-Only Governance Ledger entries or from a verifiable materialized state derived from them.
  apply_to_responses:
    require_canonical_state_matches_ordered_ledger: true
    reject_reordered_ledger_as_equivalent: true
    timestamp_order_is_not_authoritative: true
- id: HARNESS-GOVERNANCE-EVIDENCE-LINKAGE
  description: Governance Evidence SHALL reference the associated ledger entry and include ledger ordering metadata.
  apply_to_governance_evidence:
    require_ledger_reference: true
    required_ledger_reference_fields:
    - ledger_entry_id
    - ledger_sequence_value
tests:
- id: TV-PROP-001
  name: Submit qualified proposal -> Authorized for Commit Boundary Processing
  maps_to:
    profiles:
    - L1
    - L2
    - L3
    - L4
    concepts:
    - Proposal Qualification
    - Governance Decision Function
    - Execution Authorization
    - Governance Evidence
    - Append-Only Governance Ledger
  arrange:
    auth_as: T1
    hooks:
      tenant_state:
        T1: ACTIVE
      policy_resolution:
        P1: found
      pec:
        constraints_outcome: PASS
        invariants_hard_fail: false
        human_review_required: false
  request:
    method: POST
    path: /agcp/v1/proposals/submit
    headers:
      Idempotency-Key: K_PROP_001
    body:
      tenant_id: T1
      governance_domain_id: domain-primary
      proposal_id: ${AUTO_PROPOSAL_ID}
      policy_ref: *id001
      action_representation:
        action_type: do_something
        parameters:
          amount: 10
      governance_context_ref: *id002
      canonical_state_ref: *id003
      authority_lineage_ref: *id004
      governance_configuration_ref: *id005
      provenance: *id006
  capture:
    save_proposal_id_as: P_PROP_001
    save_authorization_id_as: EA_PROP_001
    save_governance_evidence_refs_as: EV_PROP_001
  expected:
    http:
      status: 200
      body:
        qualification_outcome: Qualified Proposal
        governance_decision: Authorized
        execution_authorization: Authorized for Commit Boundary Processing
    ledger_append:
    - stage: Proposal Qualification
      match:
        outcome: Qualified Proposal
      ledger_reference:
        required: true
        fields:
        - ledger_entry_id
        - ledger_sequence_value
    - stage: Governance Decision Function
      match:
        outcome: Authorized
      ledger_reference:
        required: true
        fields:
        - ledger_entry_id
        - ledger_sequence_value
    - stage: Execution Authorization
      match:
        outcome: Authorized for Commit Boundary Processing
      ledger_reference:
        required: true
        fields:
        - ledger_entry_id
        - ledger_sequence_value
    governance_evidence:
      required: true
      schema: governance_evidence.json
      requires_ledger_reference: true
- id: TV-PROP-002
