meta:
  suite_id: agcp_conformance_harness
  status: normative-harness-specification-development-synchronized-v2.1.x
  versioning: repository_release
  description: Deterministic AGCP conformance harness vectors covering the existing IF-001 surface and the v2.1.x identity/authorization
    qualification, Governance Decision Function (PDP role), Governance Realization Function, current commit-bound authority,
    PEP Profile mapping, Enforcement Context / Governance Enforcement Binding, commitment, and distinct post-commit execution-outcome
    semantics. Harness operations establish inputs and observe ordinary runtime behavior; they do not inject desired governance
    outcomes.
  assumptions:
    append_only_governance_ledger_required: true
    canonical_state_resolved_from_qualified_authoritative_sources: true
    governance_ledger_authoritative_for_recorded_events_ordering_and_derived_lifecycle_state: true
    materialized_canonical_state_must_be_reproducible_from_applicable_authoritative_sources: true
    ledger_sequence_order_is_authoritative_for_recorded_events_and_derived_lifecycle_state: true
    timestamp_or_storage_order_is_not_authoritative_for_ledger_ordering: true
    submitted_state_is_not_externally_observable: true
    governance_evidence_required_for_governance_significant_processing: true
    governance_approval_request_schema_validation_precedes_semantic_cryptographic_verification: true
    governance_approval_submission_is_untrusted_ingress: true
    governance_approval_artifact_is_agcp_created_or_qualified_record: true
    submitted_governance_approval_provenance_independently_cryptographically_verified: true
    authenticated_identity_is_not_authorization: true
    claimant_supplied_identity_and_authorization_assertions_are_non_authoritative: true
    ias_profile_qualification_precedes_authoritative_use_of_roles_entitlements_and_permissions: true
    governance_decision_does_not_establish_current_commit_eligibility: true
    grf_rederives_current_authority_and_commit_eligibility: true
    commit_request_does_not_authoritatively_supply_enforcement_context: true
    grf_selects_and_applies_pep_profile: true
    grf_assembles_enforcement_context: true
    pep_validates_governance_enforcement_binding_and_fails_closed_on_mismatch: true
    commitment_and_completed_execution_are_distinct_when_profile_declares_post_commit_execution: true
    test_controls_may_establish_conditions_but_may_not_inject_governance_outcomes: true
  agcp_release: v2.1.x
  interface_id: IF-001
  interface_version: v2
  fixture_resolution: Resolve $fixture repository paths and apply $overrides before request-schema and OpenAPI validation.
  vector_catalog:
    authoritative_source: conformance/AGCP-Conformance-Harness-Spec.yml
    human_readable_mirror: conformance/AGCP-Conformance-Test-Vectors.md
    required_id_set_equality: true
    expected_vector_count: 71
    synchronization_id: AGCP-v2.1.x-HARNESS-VECTOR-CHECK-SYNC-2026-10-03
    development_status: The enumerated standardized and implementation-specific harness paths are the current identified inventory
      and are not asserted to be exhaustive or implemented by every runtime.
  request_parameter_validation:
    authoritative_contract: api/AGCP-HTTP-Contract.yaml
    controlled_record: conformance/AGCP-harness-request-parameter-validation.json
    scope: Every primary request and every HTTP setup prestep.
    expected_request_count: 52
