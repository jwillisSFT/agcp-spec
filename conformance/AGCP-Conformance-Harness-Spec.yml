assertions:
- id: HARNESS-NO-SUBMITTED-STATE
  description: Externally observable Proposal views SHALL NOT expose SUBMITTED or other transient pre-decision states.
  apply_to_responses:
    must_not_include_state:
    - SUBMITTED
    - SUBMITTED_TRANSIENT
- id: HARNESS-PIPELINE-ORDER
  description: When ledger_append is expected, DS-040 Governance Ledger Event ordering SHALL match the expected sequence within
    the declared ordering scope.
  apply_to_ledger:
    enforce_exact_order_on_expected_append: true
    ordering_key: ledger_position.sequence
    ordering_scope_key: ordering_scope
- id: HARNESS-LEDGER-IMMUTABILITY
  description: DS-040 Governance Ledger Events SHALL be append-only and immutable after append.
  apply_to_ledger:
    forbid_update: true
    forbid_delete: true
    forbid_reorder: true
    validate_append_only_controls: true
    validate_integrity_protection: true
- id: HARNESS-CANONICAL-STATE-DERIVATION
  description: Canonical State SHALL be reproducible from the applicable qualified authoritative governance sources; incorporated
    Governance Ledger records and Derived Lifecycle State SHALL use authoritative ledger ordering.
  apply_to_responses:
    require_canonical_state_resolved_from_qualified_sources: true
    require_ledger_records_use_authoritative_ordering: true
    require_materialized_state_reproducible_from_applicable_sources: true
    reject_reordered_ledger_as_equivalent_for_ledger_derived_state: true
    timestamp_or_storage_order_is_not_authoritative: true
- id: HARNESS-GOVERNANCE-EVIDENCE-LINKAGE
  description: Governance Evidence SHALL reference associated DS-040 Governance Ledger Events through ledger_event_refs.
  apply_to_governance_evidence:
    require_ledger_event_refs: true
    required_ledger_event_ref_fields:
    - ledger_event_id
    - event_version
    - event_type
    - event_category
    - ledger_position
    - tenant_id
    - governance_domain_id
    - event_digest
    - appended_at
- id: HARNESS-IAS-CLAIMANT-NONAUTHORITATIVE
  description: Authenticated or claimant-supplied identity, role, group, entitlement, reviewer class, or authorization assertions
    SHALL NOT become authoritative without profile-qualified IAS resolution.
  apply_to_identity_authorization:
    require_authoritative_profile_resolution: true
    reject_claimant_override: true
- id: HARNESS-GDF-GRF-SEPARATION
  description: A Governance Decision or Execution Authorization SHALL NOT be treated as current commit eligibility; the GRF
    SHALL establish current eligibility at commitment.
  apply_to_governance_realization:
    require_current_authority_rederivation: true
    governance_decision_is_not_commit_eligibility: true
- id: HARNESS-GRF-OWNS-ENFORCEMENT-CONTEXT
  description: The Commit Boundary requester SHALL NOT authoritatively construct DS-029; the GRF selects the PEP Profile and
    assembles the enforcement-facing context.
  apply_to_governance_realization:
    caller_supplied_enforcement_context_authoritative: false
    grf_assembles_enforcement_context: true
- id: HARNESS-PEP-FAIL-CLOSED-BINDING
  description: The PEP SHALL fail closed on unsupported mapping, context tamper, Governance Enforcement Binding mismatch,
    or unqualified GRF caller.
  apply_to_pep:
    reject_unsupported_mapping: true
    reject_context_tamper: true
    reject_binding_mismatch: true
    reject_unqualified_grf_caller: true
- id: HARNESS-COMMIT-EXECUTION-DISTINCTION
  description: When execution is distinct from commitment, commit success SHALL NOT be interpreted as completed execution;
    DS-052 evidence controls the later operational outcome.
  apply_to_execution_outcome:
    commit_success_is_not_execution_success: true
    require_ds052_when_async: true
