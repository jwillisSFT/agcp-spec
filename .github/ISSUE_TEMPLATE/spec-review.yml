name: Specification Review Comment
description: Submit feedback on the AGCP specification
title: "[Spec Review]: "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing AGCP.

        GitHub Issues are used for public technical review of the specification.
        Submission of an issue does not modify the controlled AGCP baseline or
        confer governance or change authority.

        **Do not report exploitable security vulnerabilities through this form.**
        Use the repository's private vulnerability-reporting mechanism instead.
        
  - type: input
    id: section
    attributes:
      label: Specification Section
      description: Provide the current repository-relative document path and section number.
      placeholder: e.g. spec/AGCP-Core.docx Section 5.2
    validations:
      required: true

  - type: input
    id: assertion
    attributes:
      label: Assertion ID (if applicable)
      placeholder: e.g. AGCP-A0012

  - type: dropdown
    id: category
    attributes:
      label: Issue Category
      options:
        - Normative Defect
        - Structural Gap
        - Ambiguity
        - Conformance Clarification
        - Security Architecture Concern
        - Determinism Concern
        - Multitenant Governance Isolation Concern
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue or concern
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Resolution
      description: Suggested clarification or specification language
  
