  headers:
    RetryAfter:
      description: 'Required for HTTP 429. AGCP uses delay-seconds: a positive decimal integer indicating the minimum
        number of seconds before retry.'
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 86400
  responses:
    PublicNotFound:
      description: Protected resource not found or existence intentionally hidden. Public responses use only RESOURCE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              rejection_code: RESOURCE_NOT_FOUND
              message: The requested resource was not found.
              http_status: 404
              retryable: false
              governance_evidence_generated: false
              outcome_classification: TRANSPORT_OR_APPLICATION_ERROR
              transport_disposition: NOT_FOUND
    TooManyRequests:
      description: Pre-governance transport or service throttling. No Governance Outcome is produced.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              rejection_code: REQUEST_THROTTLED
              message: The request was throttled before governance processing began.
              http_status: 429
              retryable: true
              governance_evidence_generated: false
              outcome_classification: TRANSPORT_OR_APPLICATION_ERROR
              transport_disposition: THROTTLED
              retry_after_seconds: 30
    ServiceUnavailable:
      description: Processing cannot safely begin because system/node capacity or a required service dependency
        is unavailable. This is not itself a Governance Outcome.
      headers:
        Retry-After:
          description: Optional delay-seconds advisory for retryable HTTP 503 responses.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            capacityUnavailable:
              value:
                error:
                  rejection_code: CAPACITY_UNAVAILABLE
                  message: Required processing capacity is unavailable.
                  http_status: 503
                  retryable: true
                  governance_evidence_generated: false
                  outcome_classification: TRANSPORT_OR_APPLICATION_ERROR
                  transport_disposition: CAPACITY_UNAVAILABLE
            dependencyUnavailable:
              value:
                error:
                  rejection_code: POLICY_MODULE_UNAVAILABLE
                  message: A required Policy Evaluation Module is unavailable.
                  http_status: 503
                  retryable: true
                  governance_evidence_generated: true
                  outcome_classification: TRANSPORT_OR_APPLICATION_ERROR
                  transport_disposition: DEPENDENCY_UNAVAILABLE
